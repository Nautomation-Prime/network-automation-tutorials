---
hostname: edge-router-01

acls:
  - name: ALLOW_MANAGEMENT
    type: standard
    rules:
      - action: permit
        source: 10.10.0.0 0.0.255.255
      - action: deny
        source: any

  - name: ALLOW_WEB_TRAFFIC
    type: extended
    rules:
      - action: permit
        protocol: tcp
        source: any
        destination: any
        port: 80
      - action: permit
        protocol: tcp
        source: any
        destination: any
        port: 443
      - action: deny
        protocol: ip
        source: any
        destination: any

interface_acls:
  GigabitEthernet0/0:
    inbound: ALLOW_MANAGEMENT
  GigabitEthernet0/1:
    outbound: ALLOW_WEB_TRAFFIC
